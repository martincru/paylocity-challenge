[pytest]
# Configuración de pytest

# Directorios de pruebas
testpaths = tests

# Patrón de archivos de prueba
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opciones por defecto
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    # --html=reports/report.html
    # --self-contained-html

# Marcadores personalizados
markers =
    smoke: Pruebas de humo rápidas
    regression: Pruebas de regresión completas
    security: Pruebas de seguridad
    performance: Pruebas de rendimiento
    crud: Pruebas de operaciones CRUD
    validation: Pruebas de validación de datos

# Configuración de logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Opciones de coverage (opcional)
# addopts = --cov=. --cov-report=html --cov-report=term
